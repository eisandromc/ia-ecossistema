versao: 1.2.0
tipo: catalogo_de_acao_referencial
escopo: ChatGPT com ferramentas realmente conectadas na sessão
nota: Esta configuração NÃO é um executor de OAuth, cliente HTTP ou registro automático no loader local.
padrao_de_acesso: menor_privilegio
aprovacao_exigida_para:
- escrita
- envio
- exclusao
- compartilhamento
