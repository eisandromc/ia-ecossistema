async function run(){const prompt=$('#prompt').value.trim();if(!prompt){$('#prompt').focus();return toast('Escreva o prompt antes de executar.','warn')}
  if(!connReady()){rtab('conn');return toast('Complete a conexão: '+(conn.provider==='sample'?'o Claude da sua conta não está disponível aqui.':'informe modelo e chave.'),'warn')}
  if(S.mode==='exec'&&validate().some(i=>i.sev==='e'&&i.m.startsWith('a raiz')))return toast('O ecossistema não tem domínio raiz válido.','crit');
  $('#result').hidden=true;$('#gate').hidden=true;newRun(S.mode,prompt);uiRunning(true);
  statusTimer=setInterval(()=>{const r=S.run;if(r&&r.status==='running')statusLine(`<span class="spin"></span>${S.mode==='exec'?'Executando':'Construindo'} · ${r.calls.length} chamada(s) · ${fmtMs(now())}`);else if(r&&r.status==='waiting')statusLine('<span class="chip warn">Portão</span> aguardando sua aprovação')},300);
  try{let res;const entry=$('#entry').value;const n=byId(entry);
    if(S.mode==='gen')res=await runFactory(prompt,false);
    else if(S.mode==='evo')res=await runFactory(prompt,true);
    else if(!n||n.tipo==='dominio')res=await runDomain(prompt);
    else if(n.tipo==='orquestrador')res=await runOrchestrator(n.id,{tid:nextTid(),from:null,objetivo:prompt,entradas:{},pedido:prompt});
    else if(n.tipo==='workflow'){const r=await runWorkflow(n.id,{tid:nextTid(),from:null,objetivo:prompt,entradas:{},pedido:prompt});res={titulo:n.nome,entrega:r.entrega,fontes:r.fontes}}
    else if(n.tipo==='agente'){const r=await runAgent(n.id,{tid:nextTid(),from:null,objetivo:prompt,entradas:{},pedido:prompt});res={titulo:n.nome,entrega:r.entrega,fontes:r.fontes}}
    else if(n.tipo==='multiagentes'){const r=await runMulti(n.id,{tid:nextTid(),from:null,objetivo:'Revisar o conteúdo enviado',pedido:prompt,pacote:prompt});res={titulo:n.nome,entrega:r.entrega}}
    else{const r=await runSub(n.id,{texto:prompt},null,nextTid());res={titulo:n.nome,entrega:'```json\n'+JSON.stringify(r,null,2)+'\n```'}}
    finish('ok',res)}
  catch(e){const stopped=e.name==='AbortError'||(S.run&&S.run.abort.signal.aborted);finish(stopped?'stopped':'error',null,e)}}
function finish(status,res,err){const r=S.run;r.status=status;r.t1=now();stopTicker();clearInterval(statusTimer);uiRunning(false);$('#gate').hidden=true;
  for(const [id,st] of Object.entries(S.nstate))if(st==='active')setState(id,status==='ok'?'done':status==='error'?'error':null);
  if(err&&status==='error')ev('erro',null,null,err.message);
  renderTelemetry();renderInspector();
  const calls=r.calls.length;statusLine(status==='ok'?`<span class="chip ok">Concluída</span> ${calls} chamada(s) em ${fmtMs(r.t1)}`:status==='stopped'?`<span class="chip warn">Interrompida</span> ${calls} chamada(s)`:`<span class="chip crit">Erro</span> ${esc(err?err.message:'falha')}`);
  if(res)showResult(res)}
function showResult(res){const b=$('#result');b.hidden=false;const sim=S.run&&(S.run.provider==='sim'||S.run.virtual);
  b.innerHTML=`<div class="hd"><b>${esc(res.titulo||'Resultado')}</b><span class="row-btns">${sim?'<span class="chip">Simulação</span>':''}<button class="btn sm" id="btnCopy">Copiar</button></span></div><div class="bd mdv">${res.resumo?`<p class="hint-txt" style="margin-top:0">${esc(res.resumo)}</p>`:''}${md(res.entrega)}${res.fontes&&res.fontes.length?`<p style="margin-top:10px"><b>Fontes:</b> ${res.fontes.map(f=>`<code>${esc(f)}</code>`).join(' ')}</p>`:''}${res.checklist&&res.checklist.length?`<ul class="checks">${res.checklist.map(c=>`<li><span class="${c.ok?'y':'n'}">${c.ok?'✓':'✗'}</span>${esc(c.item)}</li>`).join('')}</ul>`:''}${res.proximo?`<p class="hint-txt" style="margin-top:10px">Próximo passo: ${esc(res.proximo)}</p>`:''}</div>`;
  if(S.run&&!S.run.virtual)requestAnimationFrame(()=>b.scrollIntoView({block:'nearest',behavior:reduced?'auto':'smooth'}));
  $('#btnCopy').onclick=async()=>{try{await navigator.clipboard.writeText(res.entrega);toast('Resultado copiado.','ok')}catch{const sel=getSelection(),rg=document.createRange();rg.selectNodeContents(b.querySelector('.bd'));sel.removeAllRanges();sel.addRange(rg);toast('Texto selecionado: use Ctrl+C para copiar.','warn')}}}
$('#btnRun').onclick=run;
$('#btnStop').onclick=()=>{if(S.run){S.run.abort.abort();finishGate({action:'stop'})}};
$('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();if(!$('#btnRun').disabled)run()}});

/* =============================== markdown =============================== */
function md(src){const L=String(src||'').replace(/\r/g,'').split('\n');let o='',i=0;
  const inl=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g,'$1<em>$2</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  while(i<L.length){const l=L[i];
    if(/^```/.test(l)){const buf=[];i++;while(i<L.length&&!/^```/.test(L[i]))buf.push(L[i++]);o+=`<pre><code>${esc(buf.join('\n'))}</code></pre>`;i++;continue}
    const h=/^(#{1,6})\s+(.*)$/.exec(l);if(h){const lv=Math.min(h[1].length+2,6);o+=`<h${lv}>${inl(h[2])}</h${lv}>`;i++;continue}
    if(/^\s*\|/.test(l)){const rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(L[i++]);const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());const body=rows.filter(r=>!/^\s*\|?\s*:?-{3,}/.test(r));if(!body.length)continue;
      o+='<div class="tbl"><table><thead><tr>'+cells(body[0]).map(c=>`<th>${inl(c)}</th>`).join('')+'</tr></thead><tbody>'+body.slice(1).map(r=>'<tr>'+cells(r).map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>';continue}
    if(/^\s*([-*+]|\d+\.)\s+/.test(l)){const ord=/^\s*\d+\./.test(l);const it=[];while(i<L.length&&/^\s*([-*+]|\d+\.)\s+/.test(L[i]))it.push(L[i++].replace(/^\s*([-*+]|\d+\.)\s+/,''));o+=`<${ord?'ol':'ul'}>`+it.map(x=>`<li>${inl(x.replace(/^\[( |x)\]\s*/i,(m,c)=>c.trim()?'☑ ':'☐ '))}</li>`).join('')+`</${ord?'ol':'ul'}>`;continue}
    if(/^>\s?/.test(l)){const buf=[];while(i<L.length&&/^>\s?/.test(L[i]))buf.push(L[i++].replace(/^>\s?/,''));o+=`<blockquote>${inl(buf.join(' '))}</blockquote>`;continue}
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){o+='<hr style="border:0;border-top:1px solid var(--line);margin:12px 0">';i++;continue}
    if(!l.trim()){i++;continue}
    const buf=[];while(i<L.length&&L[i].trim()&&!/^(#{1,6}\s|```|\s*\||\s*([-*+]|\d+\.)\s|>|\s*---\s*$)/.test(L[i]))buf.push(L[i++]);o+=`<p>${inl(buf.join(' '))}</p>`}
  return o}

/* =============================== toast + tema =============================== */
let tt=null;function toast(msg,kind){const t=$('#toast');t.className='toast '+(kind||'');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,kind==='crit'?7000:3800)}
const th=store.get('fabrica.theme');if(th)document.documentElement.dataset.theme=th;
$('#btnTheme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;store.set('fabrica.theme',nx)};

/* =============================== início =============================== */
const PKG=JSON.parse($('#pkgData').textContent);
for(const [p,c] of Object.entries(PKG))if(KIT_RE.test(p))S.kit[p]=c;
setMode('exec');renderConn();
if(!loadPackage(normalizeFiles(PKG)))return;
// execução de exemplo registrada (simulação instantânea) para a telemetria abrir preenchida
(async()=>{const d=byId(S.meta.raiz);const first=d?(sectionOf(S.files[d.arquivo],/Iniciadores/i).match(/^- (.+)$/m)||[])[1]:'';
  if(!first)return;$('#prompt').value=first;
  newRun('exec',first,{virtual:true,budget:60});try{const res=await runDomain(first);S.run.status='ok';S.run.t1=now();renderTelemetry();showResult({...res,titulo:'Execução de exemplo (simulada)',resumo:'Registro gerado ao abrir o console: mostra o caminho, as chamadas e a telemetria. Clique em Executar para rodar de verdade.'});statusLine(`<span class="chip">Exemplo</span> ${S.run.calls.length} chamadas simuladas em ${fmtMs(S.run.t1)}`)}catch(e){console.warn(e)}
  })();
// capacidades do visualizador do claude.ai
if(inViewer){window.claude.use('sample').then(s=>{sampleCap=s||null;if(sampleCap&&!store.get('fabrica.conn')){conn.provider='sample';saveConn()}renderConn()}).catch(()=>{renderConn()});
  window.claude.use('downloads').then(d=>{downloadsCap=d||null}).catch(()=>{})}
})();
</script>
